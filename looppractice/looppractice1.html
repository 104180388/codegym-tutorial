<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Bai 1</h1>
    <input type="button" onclick="bai1()" value="Raise">
    <p id="result">1</p>

    <h1>Bai 2</h1>
    <input type="button" onclick="bai2()" value="Check">

    <h1>Bai 3</h1>
    <input type="button" onclick="bai3()" value="Check">
    <p id="result3"></p>
    
</body>
<script>
    function bai1(){
        let result = document.getElementById("result");  
        let num = parseInt(result.innerText);
        num++;
        
        if(num<100){
            result.innerText = num;
        }
        else{
            result.innerText = "Da dem du 100"
        }
    }

    function bai2(){
        num = prompt("Nhap nhiet do")
        while(num<20){
            num = prompt("Vui long tang nhiet do")
        }

        while(num>100){
            num = prompt("Vui long giam nhiet do")
        }

    }

    function bai3() {
        let a = 0; // Số thứ nhất
        let b = 1; // Số thứ hai
        
        // Tạo một chuỗi chứa sẵn 2 số đầu tiên
        let resultText = a + ", " + b; 

        // Đã có 2 số, chúng ta lặp 18 lần nữa để đủ 20 số
        for (let i = 2; i < 20; i++) {
            let next = a + b; // Tính số tiếp theo
            
            resultText += ", " + next; // Nối số mới vào chuỗi kết quả
            
            // Cập nhật lại giá trị của a và b trượt lên phía trước
            a = b; 
            b = next; 
        }

        // Hiển thị chuỗi kết quả ra thẻ <p id="result3">
        document.getElementById("result3").innerText = resultText;
    }


</script>
</html>
