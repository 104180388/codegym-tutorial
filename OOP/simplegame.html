<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Objects</title>
</head>

<body>
    <div id="game"></div>
    <script>

        function Hero(image, top, left, size, speed) {
            this.image = image;
            this.top = top;
            this.left = left;
            this.size = size;
            this.speed = speed;

            this.getHeroElement = function () {
                return '<img width="' + this.size + '"' +
                    ' height="' + this.size + '"' +
                    ' src="' + this.image + '"' +
                    ' style="top: ' + this.top + 'px; left:' + this.left + 'px;position:absolute;" />';
            }

            this.moveRight = function () {
                this.left += 20;
                this.speed += 10;
                console.log('ok: ' + this.left);
            }

            this.moveLeft = function () {
                this.left -= 20;
                this.speed += 10;
                console.log('ok: ' + this.left);
            }

            this.moveUp = function () {
                this.top -= 20;
                this.speed += 10;
                console.log('ok: ' + this.top);
            }

            this.moveDown = function () {
                this.top += 20;
                this.speed += 10;
                console.log('ok: ' + this.top);
            }

        }

        var hero = new Hero('images.jpg', 20, 30, 200, 0);
        var minTop = hero.top;
        var minLeft = hero.left;

        function start() {
            if (hero.left < window.innerWidth - hero.size && hero.top == minTop) {
                hero.moveRight();
            }
            else if (hero.top < window.innerHeight - hero.size && hero.left >= window.innerWidth - hero.size) {
                hero.moveDown();
            }
            else if (hero.left > minLeft) {
                hero.moveLeft();
            }
            else {
                hero.moveUp();
            }
            document.getElementById('game').innerHTML = hero.getHeroElement();
            setTimeout(start, 500 - hero.speed)
        }

        start();
    </script>
</body>

</html>
