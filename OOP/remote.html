<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        function Remote(tV){
            this.tV=tV
            this.raiseVolume = function(dB){
                return this.tV.volume += dB
            }
            this.lowVolume = function(dB){
                return this.tV.volume -= dB
            }
            this.changeChannel = function(codeChannel){
                return this.tV.channel = codeChannel
            }
        }

        function TV(channel,volume,status){
            this.channel=channel
            this.volume=volume
            this.status=status


        }
    </script>
</body>
</html>
