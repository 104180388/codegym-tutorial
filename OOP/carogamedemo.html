<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #caroboard {
            position: relative;
            margin: 20px;
        }

        .cell {
            border: 1px solid #000000;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="caroboard">

    </div>
    <script>
        let caroBoard = "";
        let rows = 20;
        let cols = 20;
        let cellSize = 40;
        let count = 0;
        let isGameOver = false;

        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                let topPos = i * cellSize;
                let leftPos = j * cellSize;
                caroBoard += `<div id="cell-${i}-${j}" 
                                   onclick="play(${i}, ${j})" 
                                   class="cell" 
                                   style="position: absolute; width: ${cellSize}px; height: ${cellSize}px; left: ${leftPos}px; top: ${topPos}px; line-height: ${cellSize}px;">
                                   </div>`;
            }
        }
        document.getElementById("caroboard").innerHTML = caroBoard;

        function play(i, j) {
            if (isGameOver) {
                alert("Ván cờ đã kết thúc. Hãy tải lại trang để chơi ván mới!");
                return;
            }

            let currentCell = document.getElementById(`cell-${i}-${j}`);

            if (currentCell.innerHTML.trim() === "") {
                let currentPlayer = "";

                if (count % 2 === 0) {
                    currentCell.innerHTML = "X";
                    currentCell.style.color = "red";
                    currentPlayer = "X";
                } else {
                    currentCell.innerHTML = "O";
                    currentCell.style.color = "blue";
                    currentPlayer = "O";
                }

                if (checkWin(i, j, currentPlayer)) {
                    setTimeout(() => {
                        alert(`Chúc mừng! Người chơi ${currentPlayer} đã chiến thắng!!!`);
                    }, 100);
                    isGameOver = true;
                }

                count++;
            } else {
                console.log("Ô này đã có người đánh rồi, vui lòng chọn ô khác!");
            }
        }

        function getCellValue(r, c) {
            if (r < 0 || r >= rows || c < 0 || c >= cols) {
                return "";
            }
            let cell = document.getElementById(`cell-${r}-${c}`);
            return cell.innerHTML.trim();
        }

        function checkDirection(row, col, player, rowDir, colDir) {
            let consecutiveCount = 1;

            let r = row + rowDir;
            let c = col + colDir;
            while (getCellValue(r, c) === player) {
                consecutiveCount++;
                r += rowDir;
                c += colDir;
            }

            r = row - rowDir;
            c = col - colDir;
            while (getCellValue(r, c) === player) {
                consecutiveCount++;
                r -= rowDir;
                c -= colDir;
            }
            return consecutiveCount;
        }

        function checkWin(row, col, player) {
            if (checkDirection(row, col, player, 0, 1) >= 5 ||
                checkDirection(row, col, player, 1, 0) >= 5 ||
                checkDirection(row, col, player, 1, 1) >= 5 ||
                checkDirection(row, col, player, 1, -1) >= 5)
            {
                return true;
            }
            return false;
        }
    </script>
</body>

</html>
