<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function Temperature(temp){
            this.temp = temp
            this.fahrenheit = function(){
                return temp*1.8 +32
            }
            this.kelvin = function(){
                return temp+273.15
            }
        }

        let temp1 = new Temperature(25);
        let fah1 = temp1.fahrenheit()
        let kel1 = temp1.kelvin()

        let temp2 = new Temperature(30);
        let fah2 = temp2.fahrenheit()
        let kel2 = temp2.kelvin()

        alert(fah1+' '+kel1+' '+fah2+' '+kel2);

    </script>
</body>
</html>
