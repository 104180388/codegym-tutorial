<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-medcare sticky-top py-2">
        <div class="container">
            <!-- Brand Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-extrabold" href="/">
                <div class="navbar-brand-logo">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div class="d-flex flex-column">
                    <span class="fs-4 fw-extrabold text-dark lh-1" style="font-family: 'Plus Jakarta Sans', sans-serif;">Med<span class="text-teal" style="color:#0d9488;">Care</span></span>
                    <small class="text-muted fw-normal" style="font-size: 0.65rem; letter-spacing: 0.05em;">CLINIC SYSTEM</small>
                </div>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item">
                        <a class="nav-link nav-link-medcare" th:href="@{/}">
                            <i class="fa-solid fa-house me-1 text-teal" style="color:#0d9488;"></i>Trang Chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-medcare" th:href="@{/doctors}">
                            <i class="fa-solid fa-user-md me-1 text-primary"></i>Bác Sĩ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-medcare" th:href="@{/services}">
                            <i class="fa-solid fa-notes-medical me-1 text-info"></i>Bảng Giá Dịch Vụ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-medcare" th:href="@{/patient/booking}">
                            <i class="fa-solid fa-calendar-plus me-1 text-success"></i>Đặt Lịch Khám
                        </a>
                    </li>
                </ul>

                <!-- Emergency Hotline Badge -->
                <div class="d-none d-xl-flex align-items-center gap-2 me-3 px-3 py-1 bg-teal-subtle rounded-pill border border-teal-subtle" style="background-color:#ccfbf1; color:#0d9488;">
                    <i class="fa-solid fa-phone-volume text-success fa-bounce me-1"></i>
                    <span class="small font-monospace fw-bold">1900 6868</span>
                </div>

                <!-- Right Auth Action Buttons -->
                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm px-3 rounded-pill fw-medium">
                            <i class="fa-solid fa-right-to-bracket me-1"></i>Đăng Nhập
                        </a>
                        <a th:href="@{/patient/booking}" class="btn btn-primary-medcare btn-sm px-4 rounded-pill fw-bold">
                            <i class="fa-solid fa-clock me-1"></i>Đặt Lịch Ngay
                        </a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-white btn-sm rounded-pill border shadow-sm dropdown-toggle d-flex align-items-center gap-2 px-3 py-1.5" type="button" data-bs-toggle="dropdown">
                            <div class="w-7 h-7 rounded-circle bg-teal text-white d-flex align-items-center justify-content-center fw-bold small" style="width:28px; height:28px; background-color:#0d9488;">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <span sec:authentication="name" class="fw-bold text-dark small">Tài khoản</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 mt-2 p-2" style="min-width: 200px;">
                            <li class="px-3 py-2 border-bottom mb-1 bg-light rounded-3">
                                <span class="d-block text-muted small">Tài khoản đang đăng nhập</span>
                                <strong sec:authentication="name" class="d-block text-teal small" style="color:#0d9488;">Patient</strong>
                            </li>
                            <li><a class="dropdown-item rounded-2 small py-2" th:href="@{/patient/dashboard}"><i class="fa-solid fa-gauge me-2 text-teal"></i>Trang Bệnh Nhân</a></li>
                            <li><a class="dropdown-item rounded-2 small py-2" th:href="@{/staff/dashboard}"><i class="fa-solid fa-user-nurse me-2 text-primary"></i>Trang Bác Sĩ / NVT</a></li>
                            <li><a class="dropdown-item rounded-2 small py-2" th:href="@{/admin/dashboard}"><i class="fa-solid fa-user-shield me-2 text-danger"></i>Trang Quản Trị Admin</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button class="dropdown-item rounded-2 small py-2 text-danger" type="submit">
                                        <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Đăng Xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
