<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống MedCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-teal-600 flex items-center justify-center text-white text-2xl font-bold mx-auto shadow-lg shadow-teal-600/30">
                <i class="fa-solid fa-hospital-user"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Đăng Nhập Hệ Thống</h2>
            <p class="text-slate-500 text-sm">Quản lý phòng khám & Đặt lịch khám bệnh</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${param.error}" class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>
            <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
        </div>
        <div th:if="${param.logout}" class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm flex items-center gap-3">
            <i class="fa-solid fa-circle-check text-emerald-500 text-base"></i>
            <span>Bạn đã đăng xuất khỏi hệ thống thành công.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Tên Đăng Nhập / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm transition-all"
                           placeholder="Nhập username hoặc email">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Mật Khẩu</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm transition-all"
                           placeholder="Nhập mật khẩu">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-lg shadow-teal-600/30 transition-all">
                Đăng Nhập
            </button>
        </form>

        <!-- Quick Seed Data Login Info Card -->
        <div class="pt-4 border-t border-slate-200">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">Tài Khoản Thử Nghiệm (Seed Data)</p>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillAccount('admin', 'password123')"
                        class="p-2.5 rounded-xl bg-slate-100 hover:bg-teal-50 hover:border-teal-300 border border-slate-200 text-center text-xs transition-all">
                    <span class="block font-bold text-purple-700">ADMIN</span>
                    <span class="text-slate-500 font-mono text-[11px]">admin</span>
                </button>
                <button type="button" onclick="fillAccount('doctor', 'password123')"
                        class="p-2.5 rounded-xl bg-slate-100 hover:bg-teal-50 hover:border-teal-300 border border-slate-200 text-center text-xs transition-all">
                    <span class="block font-bold text-blue-700">DOCTOR</span>
                    <span class="text-slate-500 font-mono text-[11px]">doctor</span>
                </button>
                <button type="button" onclick="fillAccount('patient', 'password123')"
                        class="p-2.5 rounded-xl bg-slate-100 hover:bg-teal-50 hover:border-teal-300 border border-slate-200 text-center text-xs transition-all">
                    <span class="block font-bold text-emerald-700">PATIENT</span>
                    <span class="text-slate-500 font-mono text-[11px]">patient</span>
                </button>
            </div>
            <p class="text-center text-slate-400 text-xs mt-2">Mật khẩu dùng chung: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700 font-mono">password123</code></p>
        </div>
    </div>

    <script>
        function fillAccount(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
