<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xác thực mã OTP')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="main-container" style="display:flex; justify-content:center; align-items:center; min-height: calc(100vh - 200px);">
        <div class="card" style="width: 100%; max-width: 480px; padding: 2.25rem;">
            
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="width: 64px; height: 64px; background: #f0fdfa; color: var(--secondary); border: 1px solid #ccfbf1; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.75rem;">
                    <i class="fa-solid fa-envelope-circle-check"></i>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem;">Xác Thực Mã OTP Đăng Ký</h1>
                <p style="font-size: 0.88rem; color: var(--slate); line-height: 1.5;">
                    Mã xác nhận 6 chữ số đã được gửi tới hộp thư Gmail:
                </p>
                <div style="margin-top: 0.6rem; display: flex; justify-content: center;">
                    <span style="background: var(--primary-light); color: var(--primary); font-size: 0.92rem; font-weight: 600; padding: 0.4rem 1.1rem; border-radius: 50px; border: 1px solid #bfdbfe; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-envelope"></i> <span th:text="${maskedEmail}">user@gmail.com</span>
                    </span>
                </div>
            </div>

            <div style="background: #f0fdfa; border: 1px solid #ccfbf1; border-left: 4px solid var(--secondary); padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.88rem; color: #0f766e;">
                <i class="fa-solid fa-circle-info"></i> <strong>Hướng dẫn:</strong>
                Vui lòng mở ứng dụng Gmail hoặc truy cập hòm thư <strong th:text="${maskedEmail}">user@gmail.com</strong> (kiểm tra cả hộp thư Đến và mục <strong>Spam / Thư rác</strong>) để lấy mã xác thực 6 chữ số.
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- OTP Submission Form -->
            <form th:action="@{/verify-otp}" method="post" id="otpForm">
                <div class="form-group" style="text-align: center; margin-bottom: 1.5rem;">
                    <label class="form-label" for="otpCode" style="font-size: 0.95rem; font-weight: 600; margin-bottom: 0.75rem; display: block;">
                        Nhập 6 chữ số mã OTP từ Gmail *
                    </label>
                    <input type="text" id="otpCode" name="otpCode" class="form-control"
                           maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric"
                           placeholder="••••••" autocomplete="one-time-code" required autofocus
                           style="font-size: 1.8rem; font-weight: 700; letter-spacing: 0.6rem; text-align: center; height: 58px; color: var(--dark); border-width: 2px;">
                </div>

                <!-- Timer countdown -->
                <div style="text-align: center; font-size: 0.85rem; color: var(--slate); margin-bottom: 1.25rem;">
                    <i class="fa-regular fa-clock"></i> Mã OTP hết hạn sau:
                    <strong id="countdownTimer" style="color: var(--danger); font-size: 0.95rem;">05:00</strong>
                </div>

                <button type="submit" id="btnSubmitOtp" class="btn btn-secondary" style="width: 100%; font-size: 1rem; padding: 0.85rem;">
                    <i class="fa-solid fa-circle-check"></i> Xác Nhận & Hoàn Tất Đăng Ký
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                <!-- Resend OTP button -->
                <form th:action="@{/resend-otp}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-outline btn-sm">
                        <i class="fa-solid fa-rotate-right"></i> Gửi lại mã qua Gmail
                    </button>
                </form>
                <a th:href="@{/register}" style="color: var(--slate); text-decoration: none; font-weight: 500;">
                    <i class="fa-solid fa-arrow-left"></i> Sửa thông tin đăng ký
                </a>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const timerElement = document.getElementById('countdownTimer');
            const submitBtn = document.getElementById('btnSubmitOtp');
            const otpInput = document.getElementById('otpCode');

            // 5 minutes countdown (300 seconds)
            let durationSeconds = 300;

            function updateTimer() {
                const minutes = Math.floor(durationSeconds / 60);
                const seconds = durationSeconds % 60;
                timerElement.textContent = 
                    String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

                if (durationSeconds <= 0) {
                    clearInterval(intervalId);
                    timerElement.textContent = 'ĐÃ HẾT HẠN';
                    timerElement.style.color = 'var(--danger)';
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.classList.add('disabled');
                    }
                } else {
                    durationSeconds--;
                }
            }

            updateTimer();
            const intervalId = setInterval(updateTimer, 1000);

            // Auto-filter digits only on typing
            if (otpInput) {
                otpInput.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            }
        });
    </script>
</body>
</html>
