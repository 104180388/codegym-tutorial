<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đội ngũ bác sĩ')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="main-container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-user-doctor" style="color:var(--primary);"></i> Đội Ngũ Bác Sĩ Chuyên Khoa
            </h1>
            <p style="color:var(--slate);">Các bác sĩ tận tâm, giàu kinh nghiệm sẵn sàng lắng nghe và thăm khám cho bạn.</p>
        </div>

        <div class="grid-cards">
            <div th:each="doctor : ${doctors}" class="card">
                <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1rem;">
                    <div class="stat-icon" style="background:#e0f2fe; color:#0284c7; width:64px; height:64px; border-radius:50%;">
                        <i class="fa-solid fa-stethoscope" style="font-size:1.75rem;"></i>
                    </div>
                    <div>
                        <h3 class="card-title" style="margin-bottom:0.2rem;" th:text="${doctor.user.fullName}">Tên bác sĩ</h3>
                        <p style="font-size:0.85rem; font-weight:600; color:var(--primary);" th:text="${doctor.degree}">Học hàm / Học vị</p>
                        <p style="font-size:0.8rem; color:var(--slate);"><i class="fa-solid fa-briefcase"></i> <span th:text="${doctor.experienceYears}">10</span> năm kinh nghiệm chuyên sâu</p>
                    </div>
                </div>
                <p style="font-size:0.9rem; color:var(--slate); margin-bottom:1.25rem; line-height:1.5;" th:text="${doctor.bio}">Tiểu sử bác sĩ...</p>
                <div style="border-top:1px solid var(--border); padding-top:1rem; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.85rem; color:var(--slate);"><i class="fa-solid fa-phone"></i> Liên hệ / Tư vấn: <span th:text="${doctor.user.phone}">0903000003</span></span>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
