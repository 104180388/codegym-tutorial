<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Lịch sử khám bệnh')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="main-container">
        <div class="dashboard-layout">
            <aside th:replace="~{fragments/layout :: patientSidebar}"></aside>

            <main>
                <div style="margin-bottom: 1.5rem;">
                    <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--dark);">
                        <i class="fa-solid fa-file-medical" style="color:var(--primary);"></i> Lịch Sử Khám Bệnh & Kết
                        Quả
                    </h1>
                    <p style="color:var(--slate); font-size:0.9rem;">Tra cứu kết quả các đợt khám bệnh, đơn thuốc và
                        phác đồ điều trị chi tiết.</p>
                </div>

                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div th:if="${#lists.isEmpty(records)}" class="card"
                    style="text-align:center; padding:3rem; color:var(--slate);">
                    <i class="fa-solid fa-notes-medical"
                        style="font-size:3rem; color:var(--border); margin-bottom:1rem; display:block;"></i>
                    <p>Chưa có hồ sơ khám bệnh nào hoàn thành.</p>
                </div>

                <div class="grid-cards" style="grid-template-columns: 1fr; gap: 1rem;">
                    <div th:each="record : ${records}" class="card"
                        style="transition: transform 0.2s ease, box-shadow 0.2s ease;">
                        <div
                            style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem;">
                            <div>
                                <h3 style="font-size:1.2rem; font-weight:700; color:var(--dark); margin:0 0 0.4rem 0;"
                                    th:text="${record.appointment.service.name}">Khám nội tổng quát</h3>
                                <p style="font-size:0.9rem; color:var(--slate); margin-bottom:0.25rem;">
                                    <i class="fa-solid fa-user-doctor" style="color:var(--primary);"></i> Bác sĩ khám:
                                    <strong style="color:var(--dark);"
                                        th:text="${record.appointment.doctor.user.fullName}">BS. Lê Minh Tuấn</strong>
                                </p>
                                <p style="font-size:0.85rem; color:var(--slate); margin:0;">
                                    <i class="fa-regular fa-calendar" style="color:var(--primary);"></i> Ngày khám:
                                    <strong style="color:var(--dark);"
                                        th:text="${#temporals.format(record.appointment.appointmentDate, 'EEEE, dd/MM/yyyy', new java.util.Locale('vi', 'VN'))}">15/05/2026</strong>
                                    (<span
                                        th:text="${#temporals.format(record.appointment.appointmentTime, 'HH:mm')}">08:30</span>)
                                </p>
                            </div>
                        </div>

                        <div
                            style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem; flex-wrap:wrap; gap:0.75rem;">
                            <div>
                                <a th:href="@{/patient/prescriptions/{id}(id=${record.id})}"
                                    class="btn btn-primary btn-sm" style="padding:0.55rem 1.15rem; font-weight:700;">
                                    <i class="fa-solid fa-pills"></i> Xem Chi Tiết <i class="fa-solid fa-arrow-right"
                                        style="font-size:0.8rem; margin-left:0.25rem;"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
