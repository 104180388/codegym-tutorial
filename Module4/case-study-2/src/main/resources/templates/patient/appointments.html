<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lịch hẹn khám bệnh')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="main-container">
        <div class="dashboard-layout">
            <aside th:replace="~{fragments/layout :: patientSidebar}"></aside>

            <main>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
                    <div>
                        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--dark);">
                            <i class="fa-solid fa-calendar-check" style="color:var(--primary);"></i> Lịch Hẹn Cá Nhân
                        </h1>
                        <p style="color:var(--slate); font-size:0.9rem;">Theo dõi trạng thái lịch khám và mã số hẹn.</p>
                    </div>
                    <a th:href="@{/patient/booking}" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Đặt lịch mới</a>
                </div>

                <div th:replace="~{fragments/layout :: alerts}"></div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã lịch hẹn</th>
                                <th>Dịch vụ khám</th>
                                <th>Bác sĩ</th>
                                <th>Ngày & Giờ</th>
                                <th>STT</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(appointments)}">
                                <td colspan="7" style="text-align:center; color:var(--slate); padding:2rem;">Bạn chưa có lịch hẹn khám nào.</td>
                            </tr>
                            <tr th:each="app : ${appointments}">
                                <td><span class="user-badge" th:text="${app.appointmentCode}">APT-123456</span></td>
                                <td style="font-weight:700;" th:text="${app.service.name}">Khám nội tổng quát</td>
                                <td th:text="${app.doctor.user.fullName}">BS. Lê Minh Tuấn</td>
                                <td>
                                    <div style="font-weight:600;" th:text="${#temporals.format(app.appointmentDate, 'dd/MM/yyyy')}">15/05/2026</div>
                                    <div style="font-size:0.85rem; color:var(--slate);" th:text="${#temporals.format(app.appointmentTime, 'HH:mm')}">08:30</div>
                                </td>
                                <td>
                                    <span th:if="${app.queueNumber != null}" style="font-size:1.1rem; font-weight:800; color:var(--primary);" th:text="'#' + ${app.queueNumber}">#1</span>
                                    <span th:if="${app.queueNumber == null}" class="text-slate" style="font-size:0.85rem;">Chưa tiếp đón</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(app.status.name()).replace('_', '-')}" th:text="${app.status.name()}">PENDING</span>
                                </td>
                                <td>
                                    <form th:if="${app.status.name() == 'PENDING' or app.status.name() == 'CONFIRMED'}"
                                          th:action="@{/patient/appointments/cancel/{id}(id=${app.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                                            <i class="fa-solid fa-ban"></i> Hủy lịch
                                        </button>
                                    </form>
                                    <span th:if="${app.status.name() == 'COMPLETED'}">
                                        <a th:href="@{/patient/medical-history}" class="btn btn-outline btn-sm"><i class="fa-solid fa-file-medical"></i> Xem kết quả</a>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
