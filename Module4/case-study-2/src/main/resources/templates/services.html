<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bảng giá dịch vụ')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="main-container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">
                <i class="fa-solid fa-list-check" style="color:var(--secondary);"></i> Danh Mục 7 Dịch Vụ Y Tế Niêm Yết
            </h1>
            <p style="color:var(--slate);">Minh bạch chi phí khám chữa bệnh và hướng dẫn chuẩn bị trước khi đến phòng khám.</p>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Mã DV</th>
                        <th>Tên dịch vụ</th>
                        <th>Mô tả chi tiết</th>
                        <th>Hướng dẫn chuẩn bị</th>
                        <th>Thời lượng dự kiến</th>
                        <th>Giá niêm yết</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="service : ${services}">
                        <td><span class="user-badge" th:text="${service.serviceCode}">GENERAL_INTERNAL</span></td>
                        <td style="font-weight: 700; color: var(--dark);" th:text="${service.name}">Khám nội tổng quát</td>
                        <td style="font-size: 0.9rem; color: var(--slate);" th:text="${service.description}">Mô tả...</td>
                        <td>
                            <div style="font-size: 0.85rem; color: #0f766e; background: #f0fdf4; padding: 0.4rem 0.6rem; border-radius: 6px;" th:if="${service.preparationGuide}">
                                <i class="fa-solid fa-lightbulb"></i> <span th:text="${service.preparationGuide}"></span>
                            </div>
                        </td>
                        <td style="text-align:center; font-weight:600;" th:text="${service.estimatedDurationMin} + ' phút'">30 phút</td>
                        <td style="font-weight: 800; color: var(--primary); font-size: 1.05rem;" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">150.000 VNĐ</td>
                        <td>
                            <a th:href="@{/patient/booking}" class="btn btn-primary btn-sm"><i class="fa-solid fa-calendar-check"></i> Đặt lịch</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
