<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function convert() {
        let firstType = document.getElementById("type1").value;
        let secondType = document.getElementById("type2").value;
        let money = parseInt(document.getElementById("money").value);
        let afterConvert;
        if(firstType == "vnd" & secondType == "usd"){
            afterConvert = money/23000;
        }
        else if(firstType == "usd" & secondType == "vnd"){
            afterConvert = money*23000;
        }
        else{
            afterConvert = money
        }

        document.getElementById("money2").innerHTML = afterConvert;
    }
</script>
<style>
    td{
        height:30px;
        width: 200px;
    }
</style>

<body>
    <table>
        <tr>
            <td>Amount</td>
            <td>From currency</td>
            <td>To Currency</td>
            <td></td>
        </tr>
        <tr>
            <td><input type="number" id="money"></td>
            <td><select id="type1">
                <option value="vnd">VND</option>
                <option value="usd">USD</option>
            </select></td>
            <td><select id="type2">
                <option value="usd">USD</option>
                <option value="vnd">VND</option>
            </select></td>
            <td><button onclick="convert()">Convert</button></td>
        </tr>
    </table>

    <p id="money2"></p>
</body>

</html>
