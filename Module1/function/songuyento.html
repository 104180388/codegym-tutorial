<script>
    function check(num) {
        if (num < 2) {
            alert("Day khong phai so nguyen to");
            return false;
        }
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i === 0) {
                alert("Day khong phai so nguyen to");
                return false;
            }
        }
        alert("Day la so nguyen to");
        return true;
    }

    let num1 = prompt("Nhap so can check")
    check(num1);
</script>
