<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function mbiCheck() {
        let weight = parseFloat(document.getElementById("weight").value)
        let height = parseFloat(document.getElementById("height").value)
        let bmi = weight / (height ** 2)
        if (bmi < 18.5) {
            document.getElementById("result").innerHTML = "Chỉ số BMI là: "+ bmi+ " Bạn gầy";
        } else if (bmi < 25.0) {
            document.getElementById("result").innerHTML = "Chỉ số BMI là: "+ bmi+ " Bạn bình thường";
        } else if (bmi < 30.0) {
            document.getElementById("result").innerHTML = "Chỉ số BMI là: "+ bmi+ " Bạn thừa cân";
        } else {
            document.getElementById("result").innerHTML = "Chỉ số BMI là: "+ bmi+ " Bạn béo";
        }
    }
</script>

<body>
    <h1>Tính chỉ số cân nặng</h1>
    <table>
        <tr>
            <td>Nhập cân nặng: (kg)</td>
            <td><input type="number" id="weight"></td>
        </tr>
        <tr>
            <td>Nhập chiều cao: (m)</td>
            <td><input type="number" id="height"></td>
        </tr>
        <tr>
            <td><button onclick="mbiCheck()">Kiểm tra</button></td>
        </tr>
    </table>
    <p id="result"></p>
</body>

</html>
