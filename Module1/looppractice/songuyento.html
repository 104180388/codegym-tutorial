<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị các số nguyên tố đầu tiên</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Nhập n số nguyên tố đầu tiên muốn in ra: "));
        let count = 0;
        let n = 2;
        let result = "";

        while (count < num) {
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    isPrime = false;
                    break;
                }
            }

            if (isPrime) {
                result = result + n + "<br>";
                count++;
            }
            n++; 
        }
        document.write(result);
        
    </script>
</body>
</html>
